.v .muted{fill:var(--muted);font-size:12px}.v .title{font-weight:600}
.v .n{fill:var(--node);stroke:var(--line);stroke-width:1.3}.v .d{fill:var(--decision);stroke:var(--line);stroke-width:1.3}
