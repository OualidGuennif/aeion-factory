<svg xmlns="http://www.w3.org/2000/svg" class="v" width="757" height="591" viewBox="0 0 757 591" role="img" aria-labelledby="t d">
<title id="t">A guarded edit</title>
<desc id="d">What happens between an agent's tool call and the file system?</desc>
<style>
.v{--bg:#ffffff;--fg:#0f172a;--muted:#475569;--line:#64748b;--node:#ffffff;--soft:#f8fafc;--group:#94a3b8;
--accent:#2563eb;--decision:#fef3c7;--store:#ecfeff;--note:#fefce8}
@media (prefers-color-scheme:dark){.v{--bg:#0b1120;--fg:#e2e8f0;--muted:#94a3b8;--line:#94a3b8;--node:#1e293b;
--soft:#0b1120;--group:#475569;--accent:#60a5fa;--decision:#3b2f0b;--store:#083344;--note:#2a2a12}}
.v .bg{fill:var(--bg)}
.v text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--fg)}
.v .muted{fill:var(--muted);font-size:12px}.v .title{font-weight:600}
.v .n{fill:var(--node);stroke:var(--line);stroke-width:1.3}.v .d{fill:var(--decision);stroke:var(--line);stroke-width:1.3}
.v .s{fill:var(--store);stroke:var(--line);stroke-width:1.3}.v .x{fill:var(--node);stroke:var(--line);stroke-dasharray:5 3}
.v .g{fill:none;stroke:var(--group);stroke-dasharray:6 4;stroke-width:1.2}.v .e{fill:none;stroke:var(--line);stroke-width:1.3}
.v .dash{stroke-dasharray:5 4}.v .a{fill:var(--line)}.v .lab{fill:var(--soft);opacity:.92}
.v .act{fill:none;stroke:var(--accent);stroke-width:1.6}.v .life{stroke:var(--group);stroke-dasharray:4 4}
.v .frag{fill:none;stroke:var(--group);stroke-width:1.2}.v .note{fill:var(--note);stroke:var(--group)}
.v .solid{fill:var(--fg)}.v .ring{fill:none;stroke:var(--fg);stroke-width:1.5}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="a" d="M0,0 L10,5 L0,10 z"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="e" d="M0,0 L10,5 L0,10"/></marker></defs>
<rect class="bg" width="100%" height="100%" rx="10"/>
<line class="life" x1="124.5" y1="74.0" x2="124.5" y2="561.0"/>
<line class="life" x1="293.6" y1="74.0" x2="293.6" y2="561.0"/>
<line class="life" x1="462.8" y1="74.0" x2="462.8" y2="561.0"/>
<line class="life" x1="631.8" y1="74.0" x2="631.8" y2="561.0"/>
<g class="act"><circle cx="124.5" cy="35.0" r="7"/><path d="M124.5,42.0 v14 M114.5,47.0 h20 M124.5,56.0 l-8,10 M124.5,56.0 l8,10"/></g>
<text x="124.5" y="73.5" text-anchor="middle">Coding agent</text>
<rect class="n" x="253.5" y="30.0" width="80.2" height="44.0" rx="6"/>
<text x="293.6" y="56.5" text-anchor="middle">Harness</text>
<rect class="n" x="403.2" y="30.0" width="119.1" height="44.0" rx="6"/>
<text x="462.8" y="56.5" text-anchor="middle">Shared guards</text>
<path class="s" d="M578.5,37.0 v30.0 a53.3,7 0 0 0 106.7,0 v-30.0 a53.3,7 0 0 0 -106.7,0 a53.3,7 0 0 0 106.7,0"/>
<text x="631.8" y="60.5" text-anchor="middle">Project files</text>
<text x="209.1" y="94.0" text-anchor="middle">tool call (shell or</text>
<text x="209.1" y="111.0" text-anchor="middle">file edit)</text>
<line class="e" x1="124.5" y1="117.0" x2="291.6" y2="117.0" marker-end="url(#arrow)"/>
<text x="378.2" y="145.0" text-anchor="middle">PreToolUse event</text>
<line class="e" x1="293.6" y1="151.0" x2="460.8" y2="151.0" marker-end="url(#arrow)"/>
<text x="106.5" y="202.0" text-anchor="start" class="muted">[secret read, force-push or hook bypass]</text>
<text x="378.2" y="223.0" text-anchor="middle">refuse with the rule</text>
<text x="378.2" y="240.0" text-anchor="middle">and its fix</text>
<line class="e dash" x1="462.8" y1="246.0" x2="295.6" y2="246.0" marker-end="url(#arrow)"/>
<text x="209.1" y="274.0" text-anchor="middle">refusal, nothing ran</text>
<line class="e dash" x1="293.6" y1="280.0" x2="126.5" y2="280.0" marker-end="url(#arrow)"/>
<text x="462.7" y="348.0" text-anchor="middle">run the tool</text>
<line class="e" x1="293.6" y1="354.0" x2="629.8" y2="354.0" marker-end="url(#arrow)"/>
<text x="378.2" y="382.0" text-anchor="middle">PostToolUse:</text>
<text x="378.2" y="399.0" text-anchor="middle">after-edit checks</text>
<line class="e" x1="293.6" y1="405.0" x2="460.8" y2="405.0" marker-end="url(#arrow)"/>
<text x="293.6" y="433.0" text-anchor="middle">fast check result and the covering doc</text>
<line class="e dash" x1="462.8" y1="439.0" x2="126.5" y2="439.0" marker-end="url(#arrow)"/>
<rect class="frag" x="48.5" y="185.0" width="659.5" height="288.0" rx="4"/>
<path class="frag" d="M48.5,207.0 h44 l8,-8 v-14"/>
<text x="54.5" y="201.0" text-anchor="start" class="title">alt</text>
<line class="frag dash" x1="48.5" y1="314.0" x2="707.9" y2="314.0"/>
<text x="58.5" y="329.0" text-anchor="start" class="muted">[allowed]</text>
<rect class="note" x="395.1" y="485.0" width="304.4" height="46.0" rx="4"/>
<text x="547.3" y="504.0" text-anchor="middle">The pre-commit hook and CI repeat the</text>
<text x="547.3" y="521.0" text-anchor="middle">checks, including axiom check</text>
</svg>
